# Kandydaci do pomiaru LOKALNEGO (darmowo; pobierany jest tylko tokenizer, bez wag modelu).
#
# Pola:
#   id            krótki identyfikator (nazwa pliku wyników)
#   label         nazwa kolumny na wykresie
#   kind          hf (AutoTokenizer) | tiktoken (kodowanie OpenAI) | tokenizer_json (plik tokenizer.json z repo)
#   repo          repo na Hugging Face; alt = lista zapasowych repo (np. niebramkowane kopie unsloth/NousResearch)
#   group         global | eu | pl  (kolejność kolumn na wykresie)
#   origin        USA | Chiny | UE | Polska | inne
#   polish_model  true = polski model z polecenia prowadzącego („PLLuM / Bielik / Slayer1B”); zostaje jako kolumna
#                 w replikacji, nawet jeśli dzieli tokenizer z innym modelem
#   calibration   nazwa modelu w overthelex/tokenizer-fertility-map (kalibracja z pracą)
#   bench_ref     true = Slayer 1B, 5 modeli odniesienia Bench Team i model kontrolny Pythia (sekcja dla Bench Team)
#   group: encoder = tokenizery modeli typu BERT (NERGAL to XLM-RoBERTa); osobna grupa, poza agregatem LLM
#   trust_remote_code  true tylko gdy repo tego wymaga
#   repo_type     model (domyślnie) | dataset — np. tokenizery ze zbioru SlayerLab/tokenizers
#   subfolder     podkatalog z tokenizerem w repo (kind: hf); dla tokenizer_json ścieżka idzie w polu file
#
# UWAGA DLA AGENTA: nazwy repo są kandydatami. Każde sprawdź (czy istnieje, czy ma tokenizer). Brakujące lub
# niedostępne pomiń i wpisz do results/pominiete.md z powodem. Możesz dopisać kolejne tokenizery według reguł
# z ZADANIE_DLA_CLAUDE_CODE.md (krok 3). Repo za bramką zgody: najpierw spróbuj kopii z listy alt.

