  - {id: llama33, label: "Llama 3.3", kind: hf, repo: meta-llama/Llama-3.3-70B-Instruct, alt: [unsloth/Llama-3.3-70B-Instruct], group: global, origin: USA, calibration: "Llama 3.3 70B"}
