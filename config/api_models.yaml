# Modele mierzone przez API. AGENT UZUPEŁNIA tę listę po kroku `python -m tt.api_models`
# (plik results/api_catalog/kandydaci.csv) według reguł z ZADANIE_DLA_CLAUDE_CODE.md, krok 6.
#
# Pola: id, label, provider (aihubmix | openrouter), model (dokładne ID u dostawcy),
#       input_usd_per_m (cena wejścia za 1 mln tokenów; AIHubMix ≤ 0.20, OpenRouter = 0),
#       output_usd_per_m (opcjonalnie), origin, note (np. „kontrola: tokenizer publiczny = qwen3”).
#
# Przykłady (do weryfikacji — ID i ceny sprawdź w katalogu dostawcy):
models:
